source:
  host: 127.0.0.1
  port: 3306
  username: binflux
  password_env: BINFLUX_MYSQL_PASSWORD
  tls_ca_cert: ./tests/certs/ca.pem
  server_id: 90001
  heartbeat_interval_ms: 10000
  gtid_restart: false
  retry_initial_delay_ms: 1000
  retry_max_delay_ms: 30000
  retry_max_attempts: 0
  retry_reset_after_ms: 60000
  include_databases:
    - shop
checkpoint:
  path: ./data/checkpoint.json
pipeline:
  channel_capacity: 8
  max_buffered_bytes: 33554432
  max_event_bytes: 16777216
  max_transaction_events: 100000
  max_transaction_bytes: 67108864
metrics:
  listen_address: 127.0.0.1:9090
kafka:
  bootstrap_servers: 127.0.0.1:19092
  topic: binflux.cdc
  client_id: binflux
  partition: 0
  partition_by: fixed
  message_timeout_ms: 30000
  tls: false
  # For managed brokers, set tls: true and configure SASL as needed.
  # sasl_mechanism: PLAIN
  # sasl_username_env: BINFLUX_KAFKA_USERNAME
  # sasl_password_env: BINFLUX_KAFKA_PASSWORD
